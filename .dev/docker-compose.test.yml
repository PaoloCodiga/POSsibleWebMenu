services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  odoo:
    build:
      context: ..
      dockerfile: .dev/Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/mnt/extra-addons/possible_web_menu:ro
      - ../artifacts:/var/log/odoo
      - odoo_data:/var/lib/odoo
    command: ["odoo", "--config=/mnt/extra-addons/possible_web_menu/.dev/odoo.conf"]
volumes:
  odoo_data:
